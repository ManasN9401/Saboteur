<!doctype html>
<!-- Shown by the service worker (public/sw.js) when a page can't be fetched because there's no network.
     Self-contained: its styles are inline and its two photos are cached with it, since nothing else can
     be fetched. It reloads itself as soon as the connection is back. -->
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>No connection · Saboteur</title>
    <style>
      :root {
        --paper: #f6f1e6; --ink: #1a1712; --ink-soft: #5c5547; --pen: #c8261e;
        --desk: url("/offline/desk-day.webp"); --scrim: rgba(40, 28, 14, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #ece4d3; --desk: url("/offline/desk-night.webp"); --scrim: rgba(8, 5, 2, 0.45); }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
        background: #2a1c10 var(--desk) center / cover no-repeat fixed;
        font-family: Georgia, "Times New Roman", serif; color: var(--ink);
      }
      body::before { content: ""; position: fixed; inset: 0; background: var(--scrim); pointer-events: none; }
      .sheet {
        position: relative; width: min(100%, 540px); padding: 28px clamp(22px, 5vw, 44px) 36px; rotate: -0.8deg;
        background: var(--paper); border-radius: 2px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .head {
        display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: 1.5px solid rgba(26, 23, 18, 0.18);
        font: 500 11px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft);
      }
      h1 {
        margin: 18px 0 14px; font: 800 clamp(34px, 6.5vw, 50px)/0.98 "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
        letter-spacing: -0.02em; font-stretch: condensed;
      }
      p { max-width: 42ch; margin: 0; font-size: 18px; line-height: 1.5; color: var(--ink-soft); }
      button {
        margin-top: 24px; padding: 14px 22px 13px; border: 0; border-radius: 4px; cursor: pointer;
        font: 650 16px/1 "Helvetica Neue", Arial, sans-serif; background: var(--ink); color: var(--paper);
      }
      .stamp {
        position: absolute; bottom: 26px; right: clamp(14px, 4vw, 30px); rotate: -8deg; padding: 7px 12px 6px;
        border: 3px solid var(--pen); border-radius: 6px; box-shadow: inset 0 0 0 2.5px var(--paper), inset 0 0 0 4.5px var(--pen);
        font: 800 clamp(18px, 3.6vw, 26px)/0.92 "Arial Narrow", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.05em; text-transform: uppercase; text-align: center; color: var(--pen);
        opacity: 0.88;
      }
      .stamp small { display: block; margin-top: 3px; font-size: 0.42em; letter-spacing: 0.22em; font-weight: 600; }
      @media (max-width: 520px) { .sheet { padding-bottom: 76px; } }
      .status { margin-top: 16px; font: 500 11px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
    </style>
  </head>
  <body>
    <main class="sheet" aria-labelledby="t">
      <div class="head"><span>No connection</span><span>Saboteur</span></div>
      <h1 id="t">The line’s gone dead.</h1>
      <p>This device is offline, so the desk can’t open. Your rounds and progress are saved here and will be waiting. This page reloads by itself when you’re back online.</p>
      <button type="button" id="retry">Try again</button>
      <p class="status" id="status" aria-live="polite">Waiting for a connection…</p>
      <span class="stamp" aria-hidden="true">Off the line<small>Operator</small></span>
    </main>
    <script>
      (function () {
        var go = function () { location.reload(); };
        document.getElementById("retry").addEventListener("click", go);
        window.addEventListener("online", function () {
          document.getElementById("status").textContent = "Back online. Reopening…";
          setTimeout(go, 400);
        });
      })();
    </script>
  </body>
</html>
